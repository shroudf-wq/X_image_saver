<!-- I: text input (pressing S while typing must not save) -->
<input id="box" style="position:fixed;right:10px;top:10px;width:200px" placeholder="typing">
<div id="xkeys" style="position:fixed;right:10px;top:40px">x-shortcut:none</div>
<script>
